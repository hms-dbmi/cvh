[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = [
    "boto3~=1.43",
    # Pinned to the 5.2 LTS line (security support through April 2028).
    # Django 6.x is held back by mozilla-django-oidc, whose latest release
    # (5.0.2) declares support only through 5.2 — it backs the admin
    # service's Auth0 login. Revisit when it ships Django 6 support, or at
    # the 6.2 LTS.
    "django~=5.2",
    "django-cors-headers~=4.9",
    "django-health-check~=4.6",
    "django-ninja~=1.7",
    "email-validator~=2.3",
    "environs~=15.2",
    "gunicorn~=26.2",
    "mozilla-django-oidc>=5.0.2",
    "psycopg[binary]~=3.3",
    "pyarrow>=25.0.0",
    "pyjwt[crypto]~=2.15",
    "requests>=2.34",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff~=0.16",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = [
    "DJ001",  # null=True on string fields — existing pattern, changing requires migrations
    "DJ008",  # missing __str__ — not critical
]

[tool.ruff.lint.isort]
known-first-party = ["api", "core"]
