name: Deploy API

on:
  push:
    branches:
      - main

jobs:
  build:
    if: github.repository == 'hms-dbmi/cvh'
    # Available versions:
    # https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend
    permissions:
        id-token: write
        contents: read

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS Credentials
        if: ${{ github.event_name == 'push' && github.ref  == 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: cvh-api
          IMAGE_TAG: latest
        run: |
            docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
            docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Force new ECS deployment (API + admin)
        # API and admin live in separate ECS clusters — the admin
        # service has its own cluster (AdminECSCluster in
        # admin-back-end.yml) so the two can be scaled and monitored
        # independently.
        env:
          API_CLUSTER: ${{ secrets.ECS_API_CLUSTER }}
          API_SERVICE: ${{ secrets.ECS_API_SERVICE }}
          ADMIN_CLUSTER: ${{ secrets.ECS_ADMIN_CLUSTER }}
          ADMIN_SERVICE: ${{ secrets.ECS_ADMIN_SERVICE }}
        run: |
            set -euo pipefail
            aws ecs update-service --cluster "$API_CLUSTER" \
              --service "$API_SERVICE" --force-new-deployment
            aws ecs update-service --cluster "$ADMIN_CLUSTER" \
              --service "$ADMIN_SERVICE" --force-new-deployment