name: Publish cvh-client

# Manual dispatch — cutting a client release means:
#   1. bump the version in python-client/VERSION.txt, pyproject.toml and
#      src/cvh_client/__init__.py (the workflow checks they match)
#   2. commit + merge to main
#   3. run this workflow with the new version string as confirmation,
#      choosing TestPyPI (a rehearsal) or PyPI (the real release)
#
# Trusted publishing (OIDC) — no long-lived token. The `testpypi` and `pypi`
# environments on this repo are configured on TestPyPI and PyPI
# respectively to trust this workflow file's OIDC identity.

on:
  workflow_dispatch:
    inputs:
      index:
        description: "Where to publish (TestPyPI is a rehearsal; PyPI is the real release)"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      confirm_version:
        description: "Confirm version to publish (must match python-client/VERSION.txt)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: python-client

jobs:
  verify-and-publish:
    name: Verify and publish to ${{ inputs.index }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index }}
      url: https://${{ inputs.index == 'pypi' && 'pypi.org' || 'test.pypi.org' }}/project/cvh-client/${{ steps.read-version.outputs.version }}/

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Read VERSION.txt
        id: read-version
        run: |
          VERSION=$(cat VERSION.txt | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 VERSION.txt contains: $VERSION"

      - name: Verify version match
        run: |
          if [ "${{ steps.read-version.outputs.version }}" != "${{ inputs.confirm_version }}" ]; then
            echo "❌ ERROR: Confirmed version (${{ inputs.confirm_version }}) does not match VERSION.txt (${{ steps.read-version.outputs.version }})"
            echo "Please update VERSION.txt first or correct the input version"
            exit 1
          fi
          echo "✅ Version confirmed: ${{ steps.read-version.outputs.version }}"

      # PyPI never accepts the same version twice, so a mismatched release
      # can't be fixed by re-uploading. Check every place the version lives.
      - name: Verify version is consistent across files
        run: |
          VERSION="${{ steps.read-version.outputs.version }}"
          PYPROJECT=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          DUNDER=$(grep -m1 '^__version__ = ' src/cvh_client/__init__.py | cut -d'"' -f2)
          if [ "$PYPROJECT" != "$VERSION" ] || [ "$DUNDER" != "$VERSION" ]; then
            echo "❌ ERROR: versions differ: VERSION.txt=$VERSION pyproject.toml=$PYPROJECT __init__.py=$DUNDER"
            exit 1
          fi
          echo "✅ VERSION.txt, pyproject.toml and __init__.py all say $VERSION"

      - name: Install build dependencies
        run: uv sync --group dev

      - name: Run linting checks
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Run thin install tests
        run: uv run pytest -m "not requires_full" -vv --doctest-modules
        env:
          GH_ACTIONS: true

      - name: Install full dependencies
        run: uv sync --all-extras

      - name: Clean previous builds
        run: rm -rf dist/ build/ src/*.egg-info

      - name: Build package
        run: uv build

      - name: Check built distributions
        run: |
          uvx twine check dist/*
          echo "📦 Built distributions:"
          ls -lh dist/

      - name: Publish to ${{ inputs.index }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # `pypa/gh-action-pypi-publish` doesn't honor the job-level
          # `working-directory: python-client` default (it treats
          # paths relative to the checkout root), so point it at the
          # subdir explicitly.
          packages-dir: python-client/dist
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          print-hash: true
          # Let a TestPyPI rehearsal be re-run after a failure later in
          # the job; a version can't be uploaded twice. Never skip on
          # PyPI, where a duplicate should fail loudly.
          skip-existing: ${{ inputs.index == 'testpypi' }}

      - name: Installation + live smoke test
        env:
          # TestPyPI releases smoke against dev; PyPI releases against prod.
          CVH_SMOKE_BASE_URL: ${{ inputs.index == 'pypi' && 'https://api.visualizationhub.org' || 'https://api.dev.visualizationhub.org' }}
          # Where to fetch cvh-client itself. Its dependencies always come
          # from PyPI (TestPyPI doesn't reliably host them).
          PACKAGE_INDEX_ARGS: ${{ inputs.index == 'pypi' && '' || '--index-url https://test.pypi.org/simple/' }}
        run: |
          sleep 30  # Wait for the index to update
          uv venv test-env
          source test-env/bin/activate
          # Two steps, because uv checks only the first index that has a
          # package: with TestPyPI and PyPI both listed, it finds
          # cvh-client on PyPI and never sees a TestPyPI-only version.
          # So install cvh-client alone from the target index, then
          # resolve its dependencies from PyPI (the installed cvh-client
          # already satisfies the pin).
          uv pip install --no-deps $PACKAGE_INDEX_ARGS cvh-client==${{ steps.read-version.outputs.version }}
          uv pip install cvh-client==${{ steps.read-version.outputs.version }}

          # Install-time smoke: import works, and it's the version we published.
          python -c "import cvh_client; assert cvh_client.__version__ == '${{ steps.read-version.outputs.version }}', cvh_client.__version__; print('✅ ${{ inputs.index }} install verified')"

          # Live smoke: exercise the transport + pydantic parse path
          # against a real backend using anonymous endpoints. This
          # catches model drift (missing / wrong fields) that install-
          # only tests miss.
          python - <<'PY'
          import os, httpx
          base = os.environ["CVH_SMOKE_BASE_URL"]

          # /health is served by HealthCheckMiddleware and bypasses
          # ALLOWED_HOSTS, auth, and routing. A 200 here proves the
          # transport works and the domain resolves.
          r = httpx.get(f"{base}/health", timeout=15)
          r.raise_for_status()
          print("✅ /health reachable")

          # /api/public/visualizations is the only endpoint currently
          # served without auth (despite the name, /public/workspaces
          # requires a token). It returns @paginate output, so parse
          # through PagedVisualizations to catch model drift.
          from cvh_client.models import PagedVisualizations
          r = httpx.get(f"{base}/api/public/visualizations", timeout=15)
          r.raise_for_status()
          PagedVisualizations.model_validate(r.json())
          print("✅ PagedVisualizations schema still matches")
          PY
          deactivate
