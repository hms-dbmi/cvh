name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  build:
    if: github.repository == 'hms-dbmi/cvh'
    # Available versions:
    # https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend
    permissions:
        id-token: write
        contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version-file: './frontend/.nvmrc'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
   
    - name: Install node dependencies
      run: npm ci

    - name: Build vite
      env:
        NODE_OPTIONS: --max_old_space_size=4096
        VITE_AUTH0_DOMAIN: ${{secrets.VITE_AUTH0_DOMAIN}}
        VITE_AUTH0_CLIENTID: ${{secrets.VITE_AUTH0_CLIENTID}}
        VITE_API_AUDIENCE: ${{secrets.VITE_API_AUDIENCE}}
        VITE_API_URL: ${{secrets.VITE_API_URL}}
        VITE_CLOUDFRONT_URL: ${{secrets.VITE_CLOUDFRONT_URL}}
        VITE_CFDB_API_URL: ${{secrets.VITE_CFDB_API_URL}}
        VITE_FEATURED_PATH: featured/dev-featured.json
      run: npm run build

    - name: Configure AWS Credentials
      if: ${{ github.event_name == 'push' && github.ref  == 'refs/heads/main' }}
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
        aws-region: us-east-1

    - name: Upload to S3
      if: ${{ github.event_name == 'push' && github.ref  == 'refs/heads/main' }}
      run: |
        # Hashed assets (Vite writes content-hashed filenames under
        # `assets/`) can be cached forever — a rebuild produces a new
        # filename, so there's no risk of the browser reusing stale
        # bytes. `immutable` tells modern browsers to skip revalidation
        # entirely.
        aws s3 sync ./dist s3://${{ secrets.S3_BUCKET }} \
          --exclude "index.html" \
          --cache-control "public, max-age=31536000, immutable"

        # `index.html` names the current asset bundle by hash. It must
        # revalidate on every load so a fresh deploy is picked up on the
        # next visit (not just on hard-refresh). CloudFront invalidation
        # below handles the edge; `no-cache` here handles the browser.
        aws s3 cp ./dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
          --cache-control "public, max-age=0, must-revalidate"
    
    - name: Invalidate Cache
      if: ${{ github.event_name == 'push' && github.ref  == 'refs/heads/main' }}
      run: |
        aws cloudfront create-invalidation --distribution-id ${{secrets.CF_DISTRIBUTION_ID}} --paths "/*"