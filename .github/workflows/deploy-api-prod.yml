name: Deploy API (prod)

# Manual promotion: retag whatever's currently `cvh-api:latest` in ECR
# as `cvh-api:prod` (and `cvh-yac`, once prod YAC exists), then force
# the prod ECS services to redeploy so they pull the new manifests.
# `latest` is what the `Deploy API` workflow publishes on every push to
# main — this workflow does not rebuild.
#
# Rollback: run the workflow again with a specific source tag (via the
# `source_tag` input) instead of `latest`. deploy-api.yml tags every image
# with its full commit SHA, so pass the full SHA of the commit to go back to.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "ECR tag to promote to prod (default: latest)"
        required: false
        default: latest

jobs:
  promote:
    if: github.repository == 'hms-dbmi/cvh'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      # `contents: write` is required so the post-deploy step can push
      # a `prod-api-*` tag back to the repo.
      contents: write

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-2

      - name: Retag source images as `prod`
        # cvh-yac is promoted with the API once prod YAC exists: set the
        # variable YAC_PROD_ENABLED to true on the production environment.
        # Not the secrets: production inherits repo secrets it doesn't
        # override, so dev's ECS_YAC_* would turn this on too early. Both
        # source images are checked before either tag moves, so a missing one
        # can't leave prod half-promoted.
        env:
          SOURCE_TAG: ${{ github.event.inputs.source_tag }}
          YAC_PROD_ENABLED: ${{ vars.YAC_PROD_ENABLED }}
        run: |
          set -euo pipefail
          REPOSITORIES="cvh-api"
          if [ "$YAC_PROD_ENABLED" = "true" ]; then REPOSITORIES="$REPOSITORIES cvh-yac"; fi
          for REPOSITORY in $REPOSITORIES; do
            MANIFEST=$(aws ecr batch-get-image \
              --repository-name "$REPOSITORY" \
              --image-ids imageTag="$SOURCE_TAG" \
              --query 'images[].imageManifest' --output text)
            if [ -z "$MANIFEST" ]; then
              echo "No $REPOSITORY image found for tag $SOURCE_TAG" >&2
              exit 1
            fi
            printf '%s' "$MANIFEST" > "$RUNNER_TEMP/manifest-$REPOSITORY.json"
          done
          digest() {
            aws ecr batch-get-image --repository-name "$1" \
              --image-ids imageTag="$2" \
              --query 'images[].imageId.imageDigest' --output text
          }
          for REPOSITORY in $REPOSITORIES; do
            # ECR refuses to re-put a tag that already points at this image
            # (ImageAlreadyExistsException), which would stop the loop before
            # the next repository is tagged.
            # Checked as its own command: a failed lookup inside [ ] would
            # compare two empty strings as equal and skip the promotion.
            SOURCE_DIGEST=$(digest "$REPOSITORY" "$SOURCE_TAG")
            if [ -z "$SOURCE_DIGEST" ]; then
              echo "No digest for $REPOSITORY:$SOURCE_TAG" >&2
              exit 1
            fi
            if [ "$(digest "$REPOSITORY" prod)" = "$SOURCE_DIGEST" ]; then
              echo "$REPOSITORY:prod is already $SOURCE_TAG"
              continue
            fi
            aws ecr put-image \
              --repository-name "$REPOSITORY" \
              --image-tag prod \
              --image-manifest "file://$RUNNER_TEMP/manifest-$REPOSITORY.json"
          done

      - name: Force new ECS deployment (API + admin + YAC)
        # API and admin live in separate ECS clusters — see comment in
        # deploy-api.yml. YAC is skipped until YAC_PROD_ENABLED is set.
        env:
          API_CLUSTER: ${{ secrets.ECS_API_CLUSTER }}
          API_SERVICE: ${{ secrets.ECS_API_SERVICE }}
          ADMIN_CLUSTER: ${{ secrets.ECS_ADMIN_CLUSTER }}
          ADMIN_SERVICE: ${{ secrets.ECS_ADMIN_SERVICE }}
          YAC_PROD_ENABLED: ${{ vars.YAC_PROD_ENABLED }}
          YAC_CLUSTER: ${{ secrets.ECS_YAC_CLUSTER }}
          YAC_SERVICE: ${{ secrets.ECS_YAC_SERVICE }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$API_CLUSTER" \
            --service "$API_SERVICE" --force-new-deployment
          aws ecs update-service --cluster "$ADMIN_CLUSTER" \
            --service "$ADMIN_SERVICE" --force-new-deployment
          if [ "$YAC_PROD_ENABLED" = "true" ]; then
            aws ecs update-service --cluster "$YAC_CLUSTER" \
              --service "$YAC_SERVICE" --force-new-deployment
          fi

      - name: Find the promoted commit
        id: commit
        # Tag the commit that's now in prod, not main's newest, which differs
        # after a rollback or while a newer deploy is still running.
        # deploy-api.yml tags each image with its full commit SHA; images from
        # before that (or a failed lookup) fall back to main.
        env:
          SOURCE_TAG: ${{ github.event.inputs.source_tag }}
        run: |
          if [[ "$SOURCE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            SHA=$SOURCE_TAG
          else
            SHA=$(aws ecr describe-images --repository-name cvh-api \
              --image-ids imageTag=prod \
              --query 'imageDetails[0].imageTags' --output text \
              | tr '\t' '\n' | grep -E '^[0-9a-f]{40}$' | head -n 1)
          fi
          echo "ref=${SHA:-main}" >> "$GITHUB_OUTPUT"

      - name: Check out the promoted commit to tag
        # Only need the git tree here (the promote job above doesn't
        # check out because it's ECR-only).
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.commit.outputs.ref }}

      - name: Tag commit as prod-api-YYYY-MM-DD
        # Marks the git commit whose image was promoted. The source ECR
        # tag (`latest` or a rollback tag) is included in the annotation
        # for traceability. See `docs/release.md` for how to roll
        # CHANGELOG.md's `[Unreleased]` section after a successful deploy.
        env:
          SOURCE_TAG: ${{ github.event.inputs.source_tag }}
        run: |
          set -euo pipefail
          # Annotated tags need a committer identity; the runner has none by
          # default, so use the github-actions bot.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          SHA=$(git rev-parse --short HEAD)
          TAG="prod-api-${DATE}-${SHA}"
          git tag -a "$TAG" -m "API prod deploy $DATE ($SHA), source ECR tag: $SOURCE_TAG"
          git push origin "$TAG"
