name: Deploy API (prod)

# Manual promotion: retag whatever's currently `cvh-api:latest` in ECR
# as `cvh-api:prod`, then force the prod ECS service to redeploy so it
# pulls the new manifest. `latest` is what the `Deploy API` workflow
# publishes on every push to main — this workflow does not rebuild.
#
# Rollback: run the workflow again with a specific source tag (via the
# `source_tag` input) instead of `latest`.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "ECR tag to promote to prod (default: latest)"
        required: false
        default: latest

jobs:
  promote:
    if: github.repository == 'hms-dbmi/cvh'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      # `contents: write` is required so the post-deploy step can push
      # a `prod-api-*` tag back to the repo.
      contents: write

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-2

      - name: Retag source image as `prod`
        env:
          REPOSITORY: cvh-api
          SOURCE_TAG: ${{ github.event.inputs.source_tag }}
        run: |
          set -euo pipefail
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$SOURCE_TAG" \
            --query 'images[].imageManifest' --output text)
          if [ -z "$MANIFEST" ]; then
            echo "No image found for tag $SOURCE_TAG" >&2
            exit 1
          fi
          aws ecr put-image \
            --repository-name "$REPOSITORY" \
            --image-tag prod \
            --image-manifest "$MANIFEST"

      - name: Force new ECS deployment (API + admin)
        # API and admin live in separate ECS clusters — see comment in
        # deploy-api.yml.
        env:
          API_CLUSTER: ${{ secrets.ECS_API_CLUSTER }}
          API_SERVICE: ${{ secrets.ECS_API_SERVICE }}
          ADMIN_CLUSTER: ${{ secrets.ECS_ADMIN_CLUSTER }}
          ADMIN_SERVICE: ${{ secrets.ECS_ADMIN_SERVICE }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$API_CLUSTER" \
            --service "$API_SERVICE" --force-new-deployment
          aws ecs update-service --cluster "$ADMIN_CLUSTER" \
            --service "$ADMIN_SERVICE" --force-new-deployment

      - name: Checkout main to tag
        # Only need the git tree here (the promote job above doesn't
        # check out because it's ECR-only).
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Tag commit as prod-api-YYYY-MM-DD
        # Marks the git commit whose image was promoted. The source ECR
        # tag (`latest` or a rollback tag) is included in the annotation
        # for traceability. See `docs/release.md` for how to roll
        # CHANGELOG.md's `[Unreleased]` section after a successful deploy.
        env:
          SOURCE_TAG: ${{ github.event.inputs.source_tag }}
        run: |
          set -euo pipefail
          # Annotated tags need a committer identity; the runner has none by
          # default, so use the github-actions bot.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          SHA=$(git rev-parse --short HEAD)
          TAG="prod-api-${DATE}-${SHA}"
          git tag -a "$TAG" -m "API prod deploy $DATE ($SHA), source ECR tag: $SOURCE_TAG"
          git push origin "$TAG"
