name: Python client tests

# Runs on PRs (and push to main) that touch the client itself or the
# backend API surface. Backend-side changes trigger this workflow
# because the client consumes the backend's schema — model drift
# should surface here before a release attempt.

on:
  push:
    branches:
      - main
    paths:
      - "python-client/**"
      - "backend/core/api/**"
      - ".github/workflows/test-python-client.yml"
  pull_request:
    branches:
      - main
    paths:
      - "python-client/**"
      - "backend/core/api/**"
      - ".github/workflows/test-python-client.yml"

defaults:
  run:
    working-directory: python-client

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python-client/uv.lock

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      # Saved outputs bloat diffs and can leak local paths or tokens.
      # Fails on any code cell with outputs or an execution count;
      # cell ids and formatting are left alone.
      - name: Check notebooks have no outputs
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for path in sorted(pathlib.Path("examples").glob("*.ipynb")):
              cells = json.loads(path.read_text())["cells"]
              n = sum(
                  1
                  for c in cells
                  if c["cell_type"] == "code"
                  and (c.get("outputs") or c.get("execution_count") is not None)
              )
              if n:
                  bad.append(f"{path}: {n} code cell(s) with outputs")
          if bad:
              print("\n".join(bad))
              print("Clear all outputs in these notebooks and commit again.")
              sys.exit(1)
          print("✅ notebooks have no outputs")
          PY

      - name: Lint
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Tests
        run: uv run pytest -vv

      # Lint and the main run use 3.13 (.python-version). Also run the
      # suite on the oldest version `requires-python` allows, so code
      # that needs a newer Python fails here rather than for users.
      # Kept as a step, not a matrix, so the job's check name stays
      # `test` for the ruleset's required status check.
      - name: Tests (Python 3.10)
        run: uv run --isolated --python 3.10 --no-dev --with pytest pytest -q
