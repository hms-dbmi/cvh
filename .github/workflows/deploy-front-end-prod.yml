name: Deploy Front-End (prod)

# Manual promotion. Rebuilds the frontend with prod Auth0 / API values
# from the `production` GitHub environment, uploads to the prod bucket,
# and invalidates the prod CloudFront distribution.
#
# Uses environment secrets (not repo secrets) so prod credentials stay
# isolated from dev.

on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'hms-dbmi/cvh'
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: ./frontend
    permissions:
      id-token: write
      # `contents: write` is required so the post-deploy step can push
      # a `prod-frontend-*` tag back to the repo.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: "./frontend/.nvmrc"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install node dependencies
        run: npm ci

      - name: Build vite
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENTID: ${{ secrets.VITE_AUTH0_CLIENTID }}
          VITE_API_AUDIENCE: ${{ secrets.VITE_API_AUDIENCE }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CLOUDFRONT_URL: ${{ secrets.VITE_CLOUDFRONT_URL }}
          VITE_CFDB_API_URL: ${{ secrets.VITE_CFDB_API_URL }}
          VITE_FEATURED_PATH: featured/prod-featured.json
          # Consumed by the /changelog page to hide the [Unreleased] section
          # on prod. Unset in the dev deploy + local dev, so those environments
          # show unreleased entries alongside released ones.
          VITE_ENVIRONMENT: production
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-1

      - name: Upload to S3
        # Hashed assets (Vite writes content-hashed filenames under
        # `assets/`) can be cached forever — a rebuild produces a new
        # filename, so there's no risk of the browser reusing stale
        # bytes. `immutable` tells modern browsers to skip revalidation
        # entirely.
        #
        # `index.html` names the current asset bundle by hash. It must
        # revalidate on every load so a fresh deploy is picked up on the
        # next visit (not just on hard-refresh). CloudFront invalidation
        # below handles the edge; `no-cache` here handles the browser.
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET }} \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp ./dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Tag commit as prod-frontend-YYYY-MM-DD
        # Marks what's actually running on prod. Pair with the
        # deploy-api-prod tag to bracket "everything that shipped in
        # this deploy." See `docs/release.md` for how to roll
        # CHANGELOG.md's `[Unreleased]` section after a successful deploy.
        run: |
          set -euo pipefail
          # Annotated tags need a committer identity; the runner has none by
          # default, so use the github-actions bot.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          SHA=$(git rev-parse --short HEAD)
          TAG="prod-frontend-${DATE}-${SHA}"
          git tag -a "$TAG" -m "Frontend prod deploy $DATE ($SHA)"
          git push origin "$TAG"
