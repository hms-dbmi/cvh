name: E2E

# `paths:` filters this workflow to run only when frontend code or the
# workflow itself changes. Backend-only PRs skip this — see the note
# in test-frontend.yml about keeping the schema.d.ts in sync.

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: './frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build app for E2E
        env:
          VITE_E2E: "true"
          # Must match the MSW handler fallback in src/test/msw-handlers.ts so
          # the app and the mock register requests against the same origin.
          VITE_API_URL: "http://127.0.0.1:8000"
          # Same idea for the CFDB GraphQL origin. Matches the fallback in
          # src/test/msw-handlers.ts and the dev-mode env in playwright.config.ts.
          VITE_CFDB_API_URL: "http://127.0.0.1:9100"
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build

      - name: Run Playwright tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
