name: Frontend Tests

# `paths:` filters this workflow to run only when frontend code or the
# workflow itself changes. Backend-only PRs skip this to save runner
# time. If a backend change alters the OpenAPI schema the frontend
# consumes, remember to regenerate `frontend/src/types/schema.d.ts` in
# the same PR (via `npm run gen-api-types`) so the change is captured
# and this workflow gets a chance to catch contract drift.

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: './frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run
