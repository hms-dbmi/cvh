name: Feedback
description: Share general feedback — UX impressions, documentation gaps, questions, or something that didn't fit the other templates.
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This template is intentionally freeform. Not sure whether something is a bug or a feature request? Not sure at all? File it here — we'll route it from our end.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - User experience / usability
        - Documentation
        - Performance
        - Question about how something works
        - General impression
        - Something else
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Tell us what's on your mind. What worked well, what didn't, what confused you, what you wished existed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What were you trying to do?
      description: Helpful for us to understand your workflow. Optional.
