[project]
name = "cvh-client"
version = "0.1.0"
description = "Python API client for the Community Visualization Hub (CVH)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "John Conroy", email = "john_conroy@hms.harvard.edu" }]
maintainers = [
  { name = "HIDIVE Lab at Harvard Medical School", email = "hidive@hms.harvard.edu" },
]
keywords = ["genomics", "visualization", "gosling", "vitessce", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
vitessce = ["vitessce>=3.0"]

[project.urls]
Homepage = "https://visualizationhub.org"
Repository = "https://github.com/hms-dbmi/cvh"
Issues = "https://github.com/hms-dbmi/cvh/issues"

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "jupyterlab>=4.0",
    "vitessce>=3.0",
]

[build-system]
requires = ["uv_build>=0.7.2,<0.8"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
