AWSTemplateFormatVersion: 2010-09-09
Description: Top-level stack template that deploys a nested stack

Parameters:
  DBUserName:
    Type: String
    Description: The database main username
    NoEcho: true
  AppSecretsArn:
    Type: String
    Description: >
      ARN of a Secrets Manager entry holding app-level secrets (e.g.,
      `secret_key`). Created out-of-band — see README "Environment
      Configuration" for the expected JSON shape. Passed through to the
      back-end stack so ECS can inject the values as env vars.
    NoEcho: true
  Environment:
    Type: String
    Default: dev
    AllowedValues: [prod, dev]
  # Per-env DNS + resources. Defaults are the dev values so an
  # `aws cloudformation deploy` without overrides continues to work for
  # dev. Every prod deploy must override each of these.
  HostedZoneName:
    Type: String
    Default: vis-api.link
  HostedZoneId:
    Type: String
    Default: Z09477406JQAR0KB7G87
  BackendRootDomainName:
    Type: String
    Description: >
      Root domain for the API. In prod this is served as-is; in dev the
      environment prefix (e.g. `dev.`) is prepended by the back-end stack.
    Default: api.vis-api.link
  AdminRootDomainName:
    Type: String
    Description: Root domain for the admin service. Same prod/dev rules as BackendRootDomainName.
    Default: admin.vis-api.link
  ImageURI:
    Type: String
    Description: >
      ECR image URI for both the API and admin tasks. Prod uses a
      dedicated tag (e.g. `:prod`) that the deploy workflow retags from
      `:latest` after promotion.
    Default: "605134458779.dkr.ecr.us-east-2.amazonaws.com/cvh-api:latest"
  BackendTaskEnvFile:
    Type: String
    Description: ARN of the API task's env file in S3.
    Default: "arn:aws:s3:::cvh-env-dev/cvh-env-dev.env"
    NoEcho: true
  AdminTaskEnvFile:
    Type: String
    Description: ARN of the admin task's env file in S3.
    Default: "arn:aws:s3:::cvh-env-dev/cvh-env-dev-admin.env"
    NoEcho: true
  NetworkTemplateURL:
    Type: String
    Default: https://cvh-templates.s3.us-east-2.amazonaws.com/network.yml
  DatabaseTemplateURL:
    Type: String
    Default: https://cvh-templates.s3.us-east-2.amazonaws.com/database.yml
  BackEndTemplateURL:
    Type: String
    Default: https://cvh-templates.s3.us-east-2.amazonaws.com/back-end.yml
  AdminBackEndTemplateURL:
    Type: String
    Default: https://cvh-templates.s3.us-east-2.amazonaws.com/admin-back-end.yml

Resources:
  Network:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref NetworkTemplateURL
  Database:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref DatabaseTemplateURL
      Parameters:
        DBUserName: !Ref DBUserName
        DBSecurityGroupId: !GetAtt Network.Outputs.SecurityGroup
        Environment: !Ref Environment
        DBSubnetGroup: !GetAtt Network.Outputs.DBSubnetGroup
    DependsOn: Network
  BackEnd:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref BackEndTemplateURL
      Parameters:
        Environment: !Ref Environment
        VpcId: !GetAtt Network.Outputs.VPC
        PublicSubnetIds: !GetAtt Network.Outputs.PublicSubnets
        ECSSecurityGroupId: !GetAtt Network.Outputs.ECSSecurityGroupId
        LBSecurityGroupId: !GetAtt Network.Outputs.LBSecurityGroupId
        RdsSecretArn: !GetAtt Database.Outputs.RdsSecretArn
        RdsSecretKmsKeyArn: !GetAtt Database.Outputs.DBKeyARN
        AppSecretsArn: !Ref AppSecretsArn
        DBHost: !GetAtt Database.Outputs.DBEndpointAddress
        DBPort: !GetAtt Database.Outputs.DBEndpointPort
        DBName: !GetAtt Database.Outputs.DBName
        HostedZoneName: !Ref HostedZoneName
        HostedZoneId: !Ref HostedZoneId
        RootDomainName: !Ref BackendRootDomainName
        ImageURI: !Ref ImageURI
        TaskEnvFile: !Ref BackendTaskEnvFile
    DependsOn:
      - Network
      - Database
  AdminBackEnd:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Ref AdminBackEndTemplateURL
      Parameters:
        Environment: !Ref Environment
        VpcId: !GetAtt Network.Outputs.VPC
        PublicSubnetIds: !GetAtt Network.Outputs.PublicSubnets
        ECSSecurityGroupId: !GetAtt Network.Outputs.ECSSecurityGroupId
        RdsSecretArn: !GetAtt Database.Outputs.RdsSecretArn
        RdsSecretKmsKeyArn: !GetAtt Database.Outputs.DBKeyARN
        AppSecretsArn: !Ref AppSecretsArn
        DBHost: !GetAtt Database.Outputs.DBEndpointAddress
        DBPort: !GetAtt Database.Outputs.DBEndpointPort
        DBName: !GetAtt Database.Outputs.DBName
        HostedZoneName: !Ref HostedZoneName
        HostedZoneId: !Ref HostedZoneId
        RootDomainName: !Ref AdminRootDomainName
        ImageURI: !Ref ImageURI
        TaskEnvFile: !Ref AdminTaskEnvFile
        # Per-env SSM path holding the prefix list ID for the admin IP
        # allowlist. The prefix list itself is managed in EC2 — see
        # docs/admin-deployment.md for setup.
        AdminAllowedPrefixListId: !Sub "/cvh/admin/${Environment}/allowed-prefix-list-id"
    DependsOn:
      - Network
      - Database
