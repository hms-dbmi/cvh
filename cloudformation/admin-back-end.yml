AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Admin Django service — same image as the API, runs with
  SERVICE_VARIANT=admin, served from a separate ALB whose ingress is
  restricted to CIDRs from an EC2 managed prefix list. Auth is via Auth0
  OIDC with a role-claim gate (see backend/core/core/oidc_backend.py).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC the admin service runs in (shared with the API).
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the admin ALB and Fargate tasks.
  ECSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >
      The shared ECS task security group from the network stack. This
      template adds an additional ingress rule allowing the admin ALB SG
      to reach the task on port 8000.
  TaskName:
    Type: String
    Default: cvh-admin-task
  TaskEnvFile:
    Type: String
    Description: >
      ARN for the admin task's env file in S3. Separate from the API's
      env file so admin-specific values (e.g., ALLOWED_HOSTS,
      ALLOWED_ORIGINS for the admin subdomain) can differ.
    Default: "arn:aws:s3:::cvh-env-dev/cvh-env-dev-admin.env"
    NoEcho: true
  ImageURI:
    Type: String
    Description: Same image as the API — SERVICE_VARIANT env var picks the URL surface.
    Default: "605134458779.dkr.ecr.us-east-2.amazonaws.com/cvh-api:latest"
  RdsSecretArn:
    Type: String
    Description: RDS-managed Secrets Manager entry (provides DB_USER, DB_PASSWORD).
    NoEcho: true
  AppSecretsArn:
    Type: String
    Description: >
      App-level secrets entry. For the admin service must include keys
      `admin_secret_key`, `auth0_admin_client_id`,
      `auth0_admin_client_secret`. (The API task uses a separate
      `secret_key` field in the same secret — see back-end.yml.)
    NoEcho: true
  RdsSecretKmsKeyArn:
    Type: String
    Description: KMS key encrypting the RDS-managed secret.
  DBHost:
    Type: String
    Description: RDS endpoint address. Injected as DB_HOST.
  DBPort:
    Type: String
    Description: RDS endpoint port. Injected as DB_PORT.
  DBName:
    Type: String
    Description: Database name. Injected as DB_NAME.
  AdminAllowedPrefixListId:
    Type: AWS::SSM::Parameter::Value<String>
    Description: >
      SSM Parameter Store path holding the ID of the EC2 managed prefix
      list that lists allowed admin source CIDRs. The list is the source
      of truth — update its entries with
      `aws ec2 modify-managed-prefix-list ...` and the SG rule picks up
      the change *without* a CloudFormation deploy.
    Default: /cvh/admin/dev/allowed-prefix-list-id
  HostedZoneName:
    Type: String
    Default: vis-api.link
  HostedZoneId:
    Type: String
    Default: Z09477406JQAR0KB7G87
  RootDomainName:
    Description: >
      Prod admin domain (e.g. admin.vis-api.link). Non-prod environments
      get prefixed with the environment name (e.g. dev.admin.vis-api.link).
    Default: admin.vis-api.link
    Type: String
  Environment:
    Type: String
    Default: dev
    AllowedValues: [prod, dev]

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  CertificateManagerCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName:
        !If [
          IsProd,
          !Ref RootDomainName,
          !Sub "${Environment}.${RootDomainName}",
        ]
      ValidationMethod: DNS
      DomainValidationOptions: !If [
          IsProd,
          [{ DomainName: !Ref RootDomainName, HostedZoneId: !Ref HostedZoneId }],
          [
            {
              DomainName: !Sub "${Environment}.${RootDomainName}",
              HostedZoneId: !Ref HostedZoneId,
            },
          ],
        ]

  # Admin ALB security group — only allows ingress from the IPs listed in
  # the managed prefix list referenced by AdminAllowedPrefixListId.
  AdminLoadBalancerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} Admin LB SG (prefix-list restricted)"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref AdminAllowedPrefixListId
          Description: HTTPS from allowed admin source CIDRs
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}:AdminLBSG"
        - Key: project
          Value: "cvh"
        - Key: component
          Value: "cvh-admin"
        - Key: environment
          Value: !Ref Environment
      VpcId: !Ref VpcId

  # Allow the admin ALB to reach the shared ECS tasks SG on port 8000.
  # Defined here (not in network.yml) so adding/removing the admin stack
  # doesn't require editing the network stack.
  AdminECSIngressFromAdminLB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ECSSecurityGroupId
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !GetAtt AdminLoadBalancerSG.GroupId
      Description: Admin ALB to ECS tasks

  AdminLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "30"
      Scheme: internet-facing
      SecurityGroups:
        - !Ref AdminLoadBalancerSG
      Subnets: !Ref PublicSubnetIds
      Tags:
        - Key: project
          Value: "cvh"
        - Key: component
          Value: "cvh-admin"
      Type: application

  AdminTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "cvh-admin-tg-${Environment}"
      HealthCheckPath: /health
      Port: 8000
      Protocol: HTTP
      Tags:
        - Key: project
          Value: "cvh"
        - Key: component
          Value: "cvh-admin"
        - Key: environment
          Value: !Ref Environment
      TargetType: ip
      VpcId: !Ref VpcId

  AdminRoute53RecordSet:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneName: !Sub "${HostedZoneName}."
      RecordSets:
        - Name:
            !If [
              IsProd,
              !Ref RootDomainName,
              !Sub "${Environment}.${RootDomainName}",
            ]
          Type: A
          AliasTarget:
            DNSName: !GetAtt AdminLoadBalancer.DNSName
            EvaluateTargetHealth: false
            HostedZoneId: !GetAtt AdminLoadBalancer.CanonicalHostedZoneID

  AdminLoadBalancerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref AdminTargetGroup
          Type: forward
      LoadBalancerArn: !Ref AdminLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateManagerCertificate
    DependsOn:
      - AdminLoadBalancer

  AdminECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "cvh-admin-${AWS::StackName}"
      Tags:
        - Key: project
          Value: "cvh"
        - Key: component
          Value: "cvh-admin"
        - Key: environment
          Value: !Ref Environment

  AdminECSService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref AdminECSCluster
      DeploymentConfiguration:
        # With DesiredCount=1, MinimumHealthyPercent must be 0 so ECS can
        # stop the old task, and MaximumPercent must be 200 so it can run
        # the new + old briefly in parallel during rolling deploys. The
        # alternative (Min=0, Max=100) introduces a small downtime
        # window; for the admin service that's fine but unnecessary
        # since 200% on one task is cheap.
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      DesiredCount: 1
      EnableECSManagedTags: true
      HealthCheckGracePeriodSeconds: 60
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: !Ref TaskName
          ContainerPort: 8000
          TargetGroupArn: !Ref AdminTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroupId
          Subnets: !Ref PublicSubnetIds
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}:AdminECSService"
        - Key: project
          Value: "cvh"
        - Key: component
          Value: "cvh-admin"
      TaskDefinition: !Ref AdminECSTaskDefinition
    DependsOn:
      - AdminTargetGroup
      - AdminLoadBalancer
      - AdminLoadBalancerListener
      - AdminECSIngressFromAdminLB

  AdminECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Name: !Ref TaskName
          Image: !Ref ImageURI
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          EnvironmentFiles:
            - Type: s3
              Value: !Ref TaskEnvFile
          # SERVICE_VARIANT pinned here (not in the env file) so it's
          # impossible to misconfigure by editing S3 — the admin task is
          # ALWAYS in admin mode. DB coordinates come from the database
          # stack via CFN so they auto-update if RDS is ever recreated.
          Environment:
            - Name: SERVICE_VARIANT
              Value: admin
            - Name: DB_HOST
              Value: !Ref DBHost
            - Name: DB_PORT
              Value: !Ref DBPort
            - Name: DB_NAME
              Value: !Ref DBName
          Secrets:
            # SECRET_KEY for the admin task is intentionally separate from
            # the API's (`secret_key`) so a leak of one doesn't compromise
            # admin session cookies / CSRF tokens of the other.
            - Name: SECRET_KEY
              ValueFrom: !Sub "${AppSecretsArn}:admin_secret_key::"
            - Name: DB_USER
              ValueFrom: !Sub "${RdsSecretArn}:username::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${RdsSecretArn}:password::"
            - Name: AUTH0_ADMIN_CLIENT_ID
              ValueFrom: !Sub "${AppSecretsArn}:auth0_admin_client_id::"
            - Name: AUTH0_ADMIN_CLIENT_SECRET
              ValueFrom: !Sub "${AppSecretsArn}:auth0_admin_client_secret::"
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-create-group: true
              awslogs-group: !Sub
                - "/ecs/${Task}-task-definition"
                - Task: !Ref TaskName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - "curl -f http://127.0.0.1:8000/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
      Cpu: "512"
      ExecutionRoleArn: !GetAtt AdminECSExecutionRole.Arn
      Family: !Sub
        - "${Task}-task-definition"
        - Task: !Ref TaskName
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}:AdminECSTaskDef"
        - Key: project
          Value: "cvh"
        - Key: component
          Value: "cvh-admin"
      TaskRoleArn: !Ref AdminTaskContainerRole
    DependsOn:
      - AdminTaskContainerRole

  AdminTaskContainerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: cvh-admin-container
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource: [!Ref TaskEnvFile]
              - Sid: ECS
                Effect: Allow
                Action:
                  - ecs:DescribeTasks
                Resource: "*"
              - Sid: ECR
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"
              - Sid: GetIP
                Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: Logging
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: ["arn:aws:logs:*:*:*"]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}:AdminTaskContainerRole"
        - Key: project
          Value: "cvh"
        - Key: component
          Value: "cvh-admin"

  AdminECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: ecs-service-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Sid: AdminSecretsAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref RdsSecretArn
                  - !Ref AppSecretsArn
              - Sid: RdsSecretKmsDecrypt
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref RdsSecretKmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
        - PolicyName: cloudwatch-logs-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: "*"
        - PolicyName: s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource: [!Ref TaskEnvFile]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}:AdminECSExecutionRole"

Outputs:
  AdminECSCluster:
    Description: The admin ECS cluster
    Value: !Ref AdminECSCluster
  AdminECSService:
    Description: The admin ECS service name
    Value: !GetAtt AdminECSService.Name
  AdminLoadBalancerDNSName:
    Description: DNS name of the admin ALB
    Value: !GetAtt AdminLoadBalancer.DNSName
  AdminDomainName:
    Description: Public DNS name for the admin service
    Value:
      !If [
        IsProd,
        !Ref RootDomainName,
        !Sub "${Environment}.${RootDomainName}",
      ]
